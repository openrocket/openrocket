name: Build

on:
  push:
    branches:
      - unstable
  pull_request:
    branches:
      - unstable
  workflow_dispatch:

jobs:
  gradle:
    name: Gradle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep static analysis, coverage verification, and distribution creation on Linux.
          - os: ubuntu-latest
            gradle_command: ./gradlew
            gradle_tasks: check build dist
          # Exercise the platform-specific Gradle and test paths on Windows and macOS.
          - os: windows-latest
            gradle_command: .\gradlew.bat
            gradle_tasks: test -x jacocoTestReport
          - os: macos-latest
            gradle_command: ./gradlew
            gradle_tasks: test -x jacocoTestReport

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Execute Gradle build
        run: ${{ matrix.gradle_command }} ${{ matrix.gradle_tasks }}
      # If wanting to serialize all the engines during build
      #        run: ./gradlew serializeEnginesDist build dist
      - name: Upload build reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: build/reports/
      - name: Upload SpotBugs reports
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/**'
      - name: Upload Coverage HTML
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: '**/build/reports/jacoco/test/html/**'
      - name: Upload Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: openrocket_build_${{ github.run_number }}
          path: ${{github.workspace}}/build/libs/OpenRocket*.jar
