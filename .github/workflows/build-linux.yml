name: Build Linux installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-installers
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux installers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      INSTALL4J_VERSION: '12.0.3'
      INSTALL4J_DOWNLOAD_SHA256: 'fbd341b993ca97b2e73ee2999a401aa1754a96fb337d95ca6e69d835e45547bb'

    steps:
      - name: Validate repository configuration
        shell: bash
        env:
          INSTALL4J_LICENSE_KEY: ${{ secrets.INSTALL4J_LICENSE_KEY }}
        run: |
          if [ -z "$INSTALL4J_LICENSE_KEY" ]; then
            echo "::error::Missing GitHub INSTALL4J_LICENSE_KEY secret."
            exit 1
          fi

      - name: Checkout repository and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Read OpenRocket version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^build\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "::error::Could not read a unique, non-empty build.version from build.properties."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The runner is x86_64: the smoke test covers the universal JAR and the Linux x64 JAR, not the arm64 one.
      - name: Build and smoke-test Linux distribution JARs
        shell: bash
        env:
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew shadowJarLinuxX64 shadowJarLinuxArm64 distributionSmokeTest --no-daemon
          test -f "build/libs/OpenRocket-$OPENROCKET_VERSION-linux-x64.jar"
          test -f "build/libs/OpenRocket-$OPENROCKET_VERSION-linux-arm64.jar"

      - name: Install install4j
        id: install4j
        shell: bash
        run: |
          version_for_url=${INSTALL4J_VERSION//./_}
          archive="$RUNNER_TEMP/install4j-$INSTALL4J_VERSION.tar.gz"

          curl --fail --silent --show-error --location \
            --output "$archive" "https://download.ej-technologies.com/install4j/install4j_linux-x64_$version_for_url.tar.gz"
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
          if [ "$actual" != "$INSTALL4J_DOWNLOAD_SHA256" ]; then
            echo "::error::install4j archive checksum mismatch: expected $INSTALL4J_DOWNLOAD_SHA256, got $actual."
            exit 1
          fi

          tar -xzf "$archive" -C "$RUNNER_TEMP"
          compiler="$RUNNER_TEMP/install4j$INSTALL4J_VERSION/bin/install4jc"
          if [ ! -x "$compiler" ]; then
            echo "::error::install4jc was not found in the downloaded install4j archive."
            exit 1
          fi
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Register install4j license
        shell: bash
        env:
          INSTALL4J_LICENSE_KEY: ${{ secrets.INSTALL4J_LICENSE_KEY }}
          INSTALL4J_COMPILER: ${{ steps.install4j.outputs.compiler }}
        run: |
          "$INSTALL4J_COMPILER" -L "$INSTALL4J_LICENSE_KEY"

      - name: Build Linux installers
        shell: bash
        env:
          INSTALL4J_COMPILER: ${{ steps.install4j.outputs.compiler }}
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p install4j/26.xx/media
          "$INSTALL4J_COMPILER" \
            --build-ids=168,244 \
            --release="$OPENROCKET_VERSION" \
            --destination="$PWD/install4j/26.xx/media" \
            install4j/26.xx/openrocket-26.xx.install4j

          count=$(find install4j/26.xx/media -maxdepth 1 -name '*.sh' | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected two Linux installers, found $count."
            ls -la install4j/26.xx/media
            exit 1
          fi

          mkdir -p dist
          cp install4j/26.xx/media/*.sh dist/
          (cd dist && sha256sum *.sh | tee SHA256SUMS.txt)

      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrocket-linux-${{ github.run_number }}
          path: |
            dist/*.sh
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
