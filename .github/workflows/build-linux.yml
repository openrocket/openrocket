name: Build Linux installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-installers
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux installers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate repository configuration
        shell: bash
        env:
          INSTALL4J_LICENSE_KEY: ${{ secrets.INSTALL4J_LICENSE_KEY }}
        run: |
          if [ -z "$INSTALL4J_LICENSE_KEY" ]; then
            echo "::error::Missing GitHub INSTALL4J_LICENSE_KEY secret."
            exit 1
          fi

      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Read OpenRocket version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^build\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          if [ -z "$version" ] || [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "::error::Could not read a unique, non-empty build.version from build.properties."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The runner is x86_64: the smoke test covers the universal JAR and the Linux x64 JAR, not the arm64 one.
      - name: Build and smoke-test Linux distribution JARs
        shell: bash
        env:
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew shadowJarLinuxX64 shadowJarLinuxArm64 distributionSmokeTest --no-daemon
          test -f "build/libs/OpenRocket-$OPENROCKET_VERSION-linux-x64.jar"
          test -f "build/libs/OpenRocket-$OPENROCKET_VERSION-linux-arm64.jar"

      - name: Set up install4j
        id: install4j
        uses: ./.github/actions/setup-install4j
        with:
          license-key: ${{ secrets.INSTALL4J_LICENSE_KEY }}

      - name: Build Linux installers
        shell: bash
        env:
          INSTALL4J_COMPILER: ${{ steps.install4j.outputs.compiler }}
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p install4j/media
          "$INSTALL4J_COMPILER" \
            --build-ids=168,244 \
            --release="$OPENROCKET_VERSION" \
            --destination="$PWD/install4j/media" \
            install4j/openrocket.install4j

          count=$(find install4j/media -maxdepth 1 -name '*.sh' | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected two Linux installers, found $count."
            ls -la install4j/media
            exit 1
          fi

          mkdir -p dist
          cp install4j/media/*.sh dist/
          (cd dist && sha256sum *.sh | tee SHA256SUMS.txt)

      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrocket-linux-${{ github.run_number }}
          path: |
            dist/*.sh
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
