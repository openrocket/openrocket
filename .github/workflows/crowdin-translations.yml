name: Crowdin Translations

on:
  push:
    branches:
      - unstable
    paths:
      - core/src/main/resources/l10n/messages*.properties
      - crowdin.yml
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: crowdin-translations
  cancel-in-progress: false

jobs:
  crowdin-translations:
    name: Sync translations
    if: github.repository == 'openrocket/openrocket'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Translations edited directly in git would be overwritten by the next download. Reduce each translation file to the
      # lines that commits other than the Crowdin sync changed in this push, and remove the files without such changes, so
      # that only those strings are uploaded and translations made on Crowdin in the meantime are kept.
      - name: Collect translation edits made outside Crowdin
        id: edits
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          found=false
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges --invert-grep --grep='^Sync translations from Crowdin' "$BEFORE..HEAD")
            for file in core/src/main/resources/l10n/messages_*.properties; do
              keys=$(for commit in $commits; do git show --format= -U0 "$commit" -- "$file"; done \
                | sed -n '/^+++/d; s/^+\([^#! ][^=:]*\)[=:].*/\1/p' | sed 's/[[:space:]]*$//' | sort -u)
              if [ -n "$keys" ]; then
                awk -F'[=:]' 'NR == FNR { keys[$0]; next } { key = $1; sub(/[[:space:]]+$/, "", key) } key in keys' \
                  <(echo "$keys") "$file" > "$file.edits"
                echo "$file: $(wc -l < "$file.edits") edited strings"
                found=true
              fi
            done
          fi
          rm core/src/main/resources/l10n/messages_*.properties
          for edits in core/src/main/resources/l10n/messages_*.properties.edits; do
            if [ -e "$edits" ]; then
              mv "$edits" "${edits%.edits}"
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # Uploads the English source, and the translation edits collected above as approved translations, using crowdin.yml.
      - name: Upload to Crowdin
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788 # v3.5.0
        with:
          # The Crowdin project keeps its files in the 'unstable' version branch. Without this, the source is uploaded as a
          # second, untranslated file at the project root.
          crowdin_branch_name: unstable
          upload_sources: true
          upload_translations: ${{ steps.edits.outputs.found == 'true' }}
          auto_approve_imported: true
          import_eq_suggestions: true
          download_translations: false
          push_translations: false
          create_pull_request: false
          user: auto
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Restore the translation files
        if: steps.edits.outcome == 'success'
        run: git checkout -- core/src/main/resources/l10n

      # Downloads the translations. The pull request is opened by a later step, so that it is created by GitHub Actions
      # like the translator credits pull request.
      - name: Download from Crowdin
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788 # v3.5.0
        with:
          crowdin_branch_name: unstable
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false
          user: auto
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # A misconfigured download (for example the wrong Crowdin branch) exports untranslated files, which would replace
      # most lines of every translation. Stop instead of opening such a pull request.
      - name: Check the size of the translation changes
        shell: bash
        run: |
          failed=0
          while read -r added deleted file; do
            lines=$(git show "HEAD:$file" | wc -l)
            if [ "$deleted" -gt $((lines / 2)) ]; then
              echo "::error::$file: $deleted of $lines lines would be removed."
              failed=1
            fi
          done < <(git diff --numstat -- 'core/src/main/resources/l10n/messages_*.properties')
          exit "$failed"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: crowdin-translations
          delete-branch: true
          add-paths: core/src/main/resources/l10n/messages_*.properties
          title: Sync translations from Crowdin
          commit-message: Sync translations from Crowdin
          body: Automated update of the translations from [Crowdin](https://crowdin.com/project/openrocket).
          labels: translation
