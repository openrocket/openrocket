name: Build and sign Windows installers

on:
  workflow_dispatch:

# SignPath reads the workflow artifact and build metadata through GitHub.
permissions:
  actions: read
  contents: read

concurrency:
  group: build-windows-installers
  cancel-in-progress: false

jobs:
  build-and-sign:
    name: Build and sign Windows installers
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Commit of openrocket/Windows-ork-Preview to build the Explorer thumbnail handler from. It is pinned here, not taken
      # as a workflow input, so that the SignPath approver sees exactly which code is signed in the verified commit.
      WINDOWS_ORK_PREVIEW_REF: 'c5ded736a35dbe87afa8ea0f8e15837344e91dd9'
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_SHELL_EXTENSION_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_SHELL_EXTENSION_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Validate repository signing configuration
        shell: pwsh
        env:
          INSTALL4J_LICENSE_KEY: ${{ secrets.INSTALL4J_LICENSE_KEY }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $requiredValues = @{
            'INSTALL4J_LICENSE_KEY secret' = $env:INSTALL4J_LICENSE_KEY
            'SIGNPATH_API_TOKEN secret' = $env:SIGNPATH_API_TOKEN
            'SIGNPATH_ORGANIZATION_ID variable' = $env:SIGNPATH_ORGANIZATION_ID
            'SIGNPATH_PROJECT_SLUG variable' = $env:SIGNPATH_PROJECT_SLUG
            'SIGNPATH_SIGNING_POLICY_SLUG variable' = $env:SIGNPATH_SIGNING_POLICY_SLUG
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG variable' = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
            'SIGNPATH_SHELL_EXTENSION_ARTIFACT_CONFIGURATION_SLUG variable' = $env:SIGNPATH_SHELL_EXTENSION_ARTIFACT_CONFIGURATION_SLUG
          }

          foreach ($entry in $requiredValues.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Missing GitHub repository $($entry.Key)."
            }
          }

      - name: Checkout repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Read OpenRocket version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path 'core/src/main/resources/build.properties' -Pattern '^build\.version=(.+)$'
          if ($null -eq $match -or $match.Matches.Count -ne 1) {
            throw 'Could not read a unique build.version from build.properties.'
          }

          $version = $match.Matches[0].Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'build.version must not be empty.'
          }

          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and smoke-test Windows distribution JARs
        shell: pwsh
        run: .\gradlew.bat shadowJarWindowsX64 shadowJarWindowsArm64 distributionSmokeTest --no-daemon

      - name: Checkout Windows thumbnail handler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openrocket/Windows-ork-Preview
          ref: ${{ env.WINDOWS_ORK_PREVIEW_REF }}
          path: Windows-ork-Preview
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # Only OrkThumbnailHandler.dll is OpenRocket code and is signed. SharpShell.dll is an upstream library and is shipped
      # as distributed on NuGet, unsigned.
      - name: Build Windows thumbnail handler
        shell: pwsh
        env:
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $project = 'Windows-ork-Preview/src/OrkThumbnailHandler/OrkThumbnailHandler.csproj'
          msbuild $project /restore /p:Configuration=Release /p:Platform=x64 "/p:InformationalVersion=$env:OPENROCKET_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild exited with code $LASTEXITCODE."
          }

          $output = 'Windows-ork-Preview/src/OrkThumbnailHandler/bin/x64/Release'
          $handler = Get-Item -Path "$output/OrkThumbnailHandler.dll"
          $versionInfo = $handler.VersionInfo
          if ($versionInfo.CompanyName -ne 'OpenRocket' -or
              $versionInfo.ProductName -ne 'OpenRocket' -or
              $versionInfo.ProductVersion -ne $env:OPENROCKET_VERSION) {
            throw "Unexpected PE metadata in $($handler.Name) (company=$($versionInfo.CompanyName), product=$($versionInfo.ProductName), version=$($versionInfo.ProductVersion)); it will not match the SignPath artifact configuration."
          }

          New-Item -Path 'build/windows-shell-extension-unsigned', 'build/windows-shell-extension' -ItemType Directory -Force | Out-Null
          Copy-Item -Path $handler.FullName -Destination 'build/windows-shell-extension-unsigned/'
          Copy-Item -Path "$output/SharpShell.dll" -Destination 'build/windows-shell-extension/'

      - name: Upload unsigned thumbnail handler for SignPath
        id: upload-unsigned-shell-extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrocket-windows-shell-extension-unsigned-${{ github.run_number }}
          path: build/windows-shell-extension-unsigned/OrkThumbnailHandler.dll
          if-no-files-found: error
          retention-days: 7

      - name: Submit SignPath signing request for the thumbnail handler
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_SHELL_EXTENSION_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-shell-extension.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/build/windows-shell-extension-signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}

      # The install4j project packages build/windows-shell-extension into the installers' shell-extension directory.
      - name: Verify and stage the signed thumbnail handler
        shell: pwsh
        run: |
          ./.github/scripts/verify-authenticode.ps1 -Path 'build/windows-shell-extension-signed' -Filter 'OrkThumbnailHandler.dll' -ExpectedCount 1
          Get-ChildItem -Path 'build/windows-shell-extension-signed' -Filter 'OrkThumbnailHandler.dll' -File -Recurse |
            Copy-Item -Destination 'build/windows-shell-extension/'

      - name: Set up install4j
        id: install4j
        uses: ./.github/actions/setup-install4j
        with:
          license-key: ${{ secrets.INSTALL4J_LICENSE_KEY }}

      - name: Build unsigned Windows installers
        shell: pwsh
        env:
          INSTALL4J_COMPILER: ${{ steps.install4j.outputs.compiler }}
          OPENROCKET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # install4j only warns about a missing directory, so check that the shell extension is staged.
          foreach ($dll in 'OrkThumbnailHandler.dll', 'SharpShell.dll') {
            if (-not (Test-Path -Path "build/windows-shell-extension/$dll" -PathType Leaf)) {
              throw "build/windows-shell-extension/$dll is missing."
            }
          }

          $mediaDirectory = (New-Item -Path 'install4j/media' -ItemType Directory -Force).FullName
          $arguments = @(
            '--disable-signing'
            '--build-ids=60,248'
            "--release=$env:OPENROCKET_VERSION"
            "--destination=$mediaDirectory"
            'install4j/openrocket.install4j'
          )

          & $env:INSTALL4J_COMPILER @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "install4j exited with code $LASTEXITCODE."
          }

          $installers = @(Get-ChildItem -Path 'install4j/media' -Filter '*.exe' -File)
          if ($installers.Count -ne 2) {
            throw "Expected two Windows installers, found $($installers.Count)."
          }

          foreach ($installer in $installers) {
            $versionInfo = $installer.VersionInfo
            if ($versionInfo.CompanyName -ne 'OpenRocket' -or
                $versionInfo.ProductName -ne 'OpenRocket' -or
                $versionInfo.FileVersion -ne $env:OPENROCKET_VERSION -or
                $versionInfo.ProductVersion -ne $env:OPENROCKET_VERSION -or
                $versionInfo.LegalCopyright -ne 'OpenRocket' -or
                $versionInfo.OriginalFilename -ne $installer.Name) {
              throw "Unexpected PE metadata in $($installer.Name); it will not match the SignPath artifact configuration."
            }
          }

      - name: Upload unsigned installers for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrocket-windows-unsigned-${{ github.run_number }}
          path: install4j/media/*.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Submit SignPath signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}/install4j/signed-media
          parameters: |
            version: ${{ toJSON(steps.version.outputs.value) }}

      - name: Verify Authenticode signatures
        shell: pwsh
        run: ./.github/scripts/verify-authenticode.ps1 -Path 'install4j/signed-media' -Filter '*.exe' -ExpectedCount 2

      - name: Compute checksums of the signed installers
        shell: pwsh
        run: |
          New-Item -Path 'dist' -ItemType Directory -Force | Out-Null
          Get-ChildItem -Path 'install4j/signed-media' -Filter '*.exe' -File -Recurse | Copy-Item -Destination 'dist/'

          # Same format as sha256sum, so the file can be checked with `sha256sum -c`.
          $lines = Get-ChildItem -Path 'dist' -Filter '*.exe' -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content -Path 'dist/SHA256SUMS.txt'

      - name: Upload signed Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrocket-windows-signed-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
