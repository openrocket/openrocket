! ComponentInfo
ComponentInfo.Rocket = Это ваша ракета. Больше сказать нечего. Приятного проектирования и постройки! :)
ComponentInfo.AxialStage = <b>Ступень</b> — это <b>секция</b> модели ракеты с <b>двигателями</b>, которые воспламеняются поочерёдно; после выгорания топлива ступень <b>отделяется</b>. <br>После отделения каждая ступень должна безопасно спускаться. Основная ступень, которую часто называют <b>маршевой</b>, обычно спускается на <b>устройстве спасения</b>.
ComponentInfo.ParallelStage = <b>Разгонный блок</b> — виртуальный компонент, служащий <b>точкой крепления</b> к <b>корпусной трубе</b>; он может <b>отделяться</b> от неё в заданный момент полёта. <br>Чаще всего разгонные блоки используют для крепления <b>навесных ускорителей</b>.
ComponentInfo.PodSet = <b>Гондола</b> — виртуальный компонент, служащий <b>точкой крепления</b> к <b>корпусной трубе</b>. <br>Создав гондолу, к ней можно прикреплять другие компоненты, строя сложные компоновки ракеты.
ComponentInfo.NoseCone = <b>Носовой обтекатель</b> — это <b>передняя часть</b> корпуса ракеты. Форма обтекателей бывает самой разной. <br>Заднюю часть можно обточить, чтобы получилась <b>посадочная юбка</b>, которая входит в корпусную трубу и удерживает обтекатель на месте.
ComponentInfo.BodyTube = <b>Корпусная труба</b> — основной элемент <b>конструкции</b> наружного корпуса модели ракеты.
ComponentInfo.Transition = <b>Переход</b> — часть корпуса, которая <b>соединяет</b> две <b>корпусные трубы</b> с <b>разными</b> наружными <b>диаметрами</b>. <br>Оба конца перехода обтачиваются, образуя посадочные юбки, которые входят в корпусные трубы и удерживают переход с обеих сторон.
ComponentInfo.TrapezoidFinSet = Стабилизаторы помогают <b>стабилизировать</b> ракету. Самая распространённая форма — <b>трапециевидная</b>: четыре стороны с параллельными корневой и концевой хордами (кромка, приклеиваемая к корпусной трубе, и внешняя кромка).
ComponentInfo.EllipticalFinSet = Стабилизаторы помогают <b>стабилизировать</b> ракету. Самая эффективная форма — <b>эллиптическая</b>. Она создаёт <b>наименьшее сопротивление</b> среди всех форм стабилизаторов. Обычно её используют на соревнованиях.
ComponentInfo.FreeformFinSet = Стабилизаторы помогают <b>стабилизировать</b> ракету. Самый универсальный компонент — <b>стабилизатор свободной формы</b>. Он позволяет создавать практически любую сплошную форму, вводя точки вручную или импортируя форму из файла изображения.
ComponentInfo.TubeFinSet = <b>Трубчатые стабилизаторы</b> помогают модели ракеты сохранять <b>прямолинейный полёт после пуска</b>. Их длина и диаметр могут быть разными, а концы — прямыми или изогнутыми. <br>Сейчас OpenRocket поддерживает только прямые перпендикулярные срезы.
ComponentInfo.RailButton = <b>Ползуны направляющей</b> не дают модели ракеты <b>менять ориентацию</b> при пуске. Чаще всего их используют на крупных моделях, парами, <b>вместо</b> <b>направляющих колец</b>. <br>Их можно закрепить снаружи корпусной трубы винтом с внутренней гайкой. <br>Ползун выглядит как две шайбы с распорной втулкой между ними: одна шайба прижата к корпусной трубе, а другая скользит внутри направляющего рельса.
ComponentInfo.LaunchLug = <b>Направляющее кольцо</b> — самый распространённый элемент, который не даёт небольшой модели ракеты <b>менять ориентацию</b>, пока ракета не сойдёт с направляющей.
ComponentInfo.InnerTube = <b>Внутренние трубы</b> чаще всего используют как <b>трубы для двигателей</b>, но они могут быть частью и других внутренних систем, например вышибных перегородок и конструкций с регулируемым грузом. <br>Внутренние трубы могут располагаться радиально внутри корпусной трубы, а при использовании в качестве двигательных труб — объединяться в кластер.
ComponentInfo.TubeCoupler = <b>Муфта</b> — короткая труба, которая <b>соединяет</b> две <b>трубы</b> с <b>одинаковыми диаметрами</b>. <br>В моделях ракет с электроникой муфту можно использовать для <b>отсека авионики</b>. <br>Трубы часто приклеивают к муфте, чтобы они не сдвигались.
ComponentInfo.CenteringRing = <b>Центрирующие кольца</b> служат для <b>установки</b> одной или нескольких <b>внутренних труб</b> внутри <b>корпусной трубы</b>. <br>В оперении есть функция <b>автоматических крепёжных выступов</b>, которая определяет оптимальную конфигурацию выступов по внутренней трубе, расположенной под корневой хордой стабилизаторов. Для этого также нужны два центрирующих кольца под корневой хордой.
ComponentInfo.Bulkhead = <b>Переборка</b> — диск, который может иметь или не иметь небольшое отверстие в центре. Переборки <b>герметизируют</b> одну область модели ракеты от другой или служат для крепления петель системы спасения для <b>присоединения стропы-амортизатора</b>, например в качестве крышек носового обтекателя и отсека авионики.
ComponentInfo.EngineBlock = <b>Упор двигателя</b> препятствует движению двигателя вперёд в трубе.<br><br>Для того чтобы добавить двигатель, создайте <b>Корпусную трубу</b> или <b>Внутреннюю трубу</b> и отметьте этот элемент как крепёж двигателя на вкладке <em>Двигатель</em> .
ComponentInfo.Parachute = <b>Парашют</b> — самое распространённое <b>устройство спасения</b>. Небольшие парашюты для моделей ракет делают из тонких лёгких материалов, таких как полиэтилен или майлар, а большие — обычно из нейлонового рипстопа. Парашюты можно украшать яркими контрастными цветами и узорами для лучшей видимости. <br><b>Стропы</b> соединяют <b>купол</b> парашюта со <b>стропой-амортизатором</b>. Иногда стропы собирают вместе и крепят через вертлюг.
ComponentInfo.Streamer = <b>Тормозная лента</b> — это <b>устройство спасения</b>, которое после выброса разворачивается и <b>замедляет</b> модель <b>ракеты</b> при спуске. <br>Лента представляет собой длинную узкую <b>прямоугольную полосу</b> из крепированной бумаги или тонкой пластиковой плёнки. Ширину и длину ленты подбирают под массу ракеты, но <b>соотношение длины к ширине 10:1</b> считается оптимальным для ленты.
ComponentInfo.ShockCord = <b>Стропа-амортизатор</b> соединяет <b>носовой обтекатель</b> и <b>устройство спасения</b> с <b>корпусной трубой</b>, не давая модели ракеты развалиться при <b>спуске</b>. <br>На небольших ракетах обычно ставят короткие эластичные стропы-амортизаторы, а на крупных — длинные, из нейлона или термостойкой кевларовой ленты.
ComponentInfo.MassComponent = <b>Груз</b> можно использовать для моделирования <b>компонента</b>, <b>отсутствующего в списке</b>. <br>В OpenRocket этот тип компонента можно обозначить, например, как <b>альтиметр</b>, <b>полётный компьютер</b> или <b>батарею</b>… Для каждого обозначения есть своя уникальная иконка, чтобы их было проще различать.

