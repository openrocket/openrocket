! Shape
Shape.Conical = Конический
Shape.Conical.desc1 = Конический носовой обтекатель обладает треугольным профилем.
Shape.Conical.desc2 = У конического перехода прямые стороны.
Shape.Ogive = Оживальный
Shape.Ogive.desc1 = Оживальный носовой обтекатель имеет профиль в виде дуги окружности. Значение параметра формы 1 даёт <b>касательный оживальный профиль</b> с плавным переходом в корпусную трубу; значения меньше 1 дают <b>секущие оживальные профили</b>.
Shape.Ogive.desc2 = Оживальный переход имеет профиль в виде дуги окружности. Значение параметра формы 1 даёт <b>касательный оживальный профиль</b> с плавным переходом в корпусную трубу у заднего конца; значения меньше 1 дают <b>секущие оживальные профили</b>.
Shape.Ellipsoid = Эллипсоид
Shape.Ellipsoid.desc1 = Эллипсоидный носовой обтекатель имеет профиль половины эллипса; оси равны 2×<i>длине</i> и <i>диаметру</i>.
Shape.Ellipsoid.desc2 = Эллипсоидный переход имеет профиль половины эллипса; оси равны 2×<i>длине</i> и <i>диаметру</i>. Если переход не обрезан, профиль продолжается в центре на соответствующий радиус.
Shape.Powerseries = Степенной
Shape.Powerseries.desc1 = Носовой обтекатель степенной формы имеет профиль <i>Radius</i>&nbsp;&times;&nbsp;(<i>x</i>&nbsp;/&nbsp;<i>Length</i>)<sup><i>k</i></sup>, где <i>k</i> — параметр формы. При <i>k</i>=0,5 это <b>параболический</b> обтекатель (показатель степени ½), при <i>k</i>=0,75 — <b>показатель ¾</b>, а при <i>k</i>=1 — <b>конический</b>.
Shape.Powerseries.desc2 = Переход степенной формы имеет профиль <i>Radius</i>&nbsp;&times;&nbsp;(<i>x</i>&nbsp;/&nbsp;<i>Length</i>)<sup><i>k</i></sup>, где <i>k</i> — параметр формы. При <i>k</i>=0,5 переход <b>параболический</b> (показатель степени ½), при <i>k</i>=0,75 — <b>показатель ¾</b>, а при <i>k</i>=1 — <b>конический</b>.
Shape.Parabolicseries = Параболический
Shape.Parabolicseries.desc1 = Носовой обтекатель параболической серии имеет профиль параболы. Параметр формы определяет используемый участок параболы. Значение 1.0 соответствует <b>полной параболе</b>, касательной к корпусу; 0.75 — <b>3/4 параболы</b>; 0.5 — <b>1/2 параболы</b>; 0 — <b>коническому</b> носовому обтекателю.
Shape.Parabolicseries.desc2 = Переход параболической серии имеет профиль параболы. Параметр формы определяет используемый участок параболы. Значение 1.0 соответствует <b>полной параболе</b>, касательной к корпусу в задней части; 0.75 — <b>3/4 параболы</b>; 0.5 — <b>1/2 параболы</b>; 0 — <b>коническому</b> переходу.
Shape.Haackseries = Серия Хаака
Shape.Haackseries.desc1 = Носовые обтекатели серии Хаака спроектированы для минимизации сопротивления. Параметр формы 0 соответствует обтекателю <b>LD-Haack</b> или <b>фон Карман</b>, который минимизирует сопротивление при заданных длине и диаметре; значение 0.333 — обтекателю <b>LV-Haack</b>, который минимизирует сопротивление при заданных длине и объёме.
Shape.Haackseries.desc2 = Носовые обтекатели серии Хаака <i>спроектированы</i> для минимизации сопротивления. Эти формы переходов являются их эквивалентами, но не обязательно обеспечивают оптимальное сопротивление для переходов. Параметр формы 0 соответствует форме <b>LD-Haack</b> или <b>фон Карман</b>, а значение 0.333 — форме <b>LV-Haack</b>.


