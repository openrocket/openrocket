# Monte Carlo analysis
LandingDispersionDlg.title = Анализ Монте-Карло — %s
LandingDispersionDlg.lbl.introduction = Выполните расчёт номинальной траектории и воспроизводимого набора траекторий с разбросом. Задайте распределение и разброс каждого входного параметра; нулевой разброс оставляет параметр фиксированным.
LandingDispersionDlg.lbl.runs = Расчётов с разбросом:
LandingDispersionDlg.lbl.runs.ttip = <html><b>100–500 расчётов:</b> подходят для быстрой приблизительной проверки сноса ветром или разброса устойчивости.<br><b>1 000–3 000 расчётов:</b> оптимально для стандартного анализа моделей ракет; распределения показателей и точки приземления становятся гладкими и надёжными.<br><b>От 5 000 расчётов:</b> полезно для редких выбросов траекторий, оценки запасов безопасности для мощных ракет и сложных многофакторных ветров.</html>
LandingDispersionDlg.lbl.seed = Главное зерно:
LandingDispersionDlg.lbl.seed.ttip = Знаковое 32-битное значение для воспроизведения тех же выборок неопределённостей и случайности моделирования
LandingDispersionDlg.lbl.spreads = Разбросы входных параметров:
LandingDispersionDlg.lbl.running = Выполняется расчёт траекторий Монте-Карло…
LandingDispersionDlg.lbl.progress = Завершено траекторий: %d из %d
LandingDispersionDlg.lbl.cancelling = Отмена после текущего шага моделирования…
LandingDispersionDlg.border.parameterHelp = Выбранный параметр
LandingDispersionDlg.but.newSeed = Новое зерно
LandingDispersionDlg.but.defaultValues = Сбросить к значениям по умолчанию
LandingDispersionDlg.but.defaultValues.ttip = Восстановить практичные начальные разбросы; при наличии замените их измеренными значениями
LandingDispersionDlg.but.allFixed = Зафиксировать все
LandingDispersionDlg.but.allFixed.ttip = Обнулить все разбросы, оставив изменение между расчётами только стохастической модели ветра
LandingDispersionDlg.but.run = Выполнить анализ
LandingDispersionDlg.but.plotCached = Показать кэшированный анализ
LandingDispersionDlg.but.plotCached.ttip = Открыть последний завершённый подходящий анализ без повторного расчёта траекторий
LandingDispersionDlg.col.group = Группа
LandingDispersionDlg.col.parameter = Параметр
LandingDispersionDlg.col.distribution = Распределение
LandingDispersionDlg.col.spread = Разброс
LandingDispersionDlg.col.unit = Единица
LandingDispersionDlg.distribution.normal = Нормальное (1σ)
LandingDispersionDlg.distribution.uniform = Равномерное (±)
LandingDispersionDlg.distribution.lognormal = Логарифмически нормальное (1σ логарифма)
LandingDispersionDlg.distribution.normal.help = Разброс нормального распределения — одно стандартное отклонение вокруг номинального значения.
LandingDispersionDlg.distribution.uniform.help = Разброс равномерного распределения — максимальное положительное или отрицательное отклонение от номинала.
LandingDispersionDlg.distribution.lognormal.help = Разброс логарифмически нормального распределения — одно стандартное отклонение натурального логарифма множителя. Множитель остаётся положительным, а его медиана равна номинальному значению, поэтому среднее немного выше номинала. Доступно только для относительных параметров.
LandingDispersionDlg.distribution.relativeOnly = Логарифмически нормальное распределение применимо только к параметрам, которые выбираются как относительный множитель, поэтому для этого параметра оно недоступно.
LandingDispersionDlg.group.weather = Погода
LandingDispersionDlg.group.launcher = Пусковая установка
LandingDispersionDlg.group.vehicle = Ракета
LandingDispersionDlg.group.propulsion = Двигательная установка
LandingDispersionDlg.group.recovery = Система спасения
LandingDispersionDlg.parameter.windSpeed = Скорость ветра
LandingDispersionDlg.parameter.windSpeed.help = Добавляет выборочное смещение к средней скорости ветра или к каждому уровню многоуровневого профиля ветра. Отрицательные получившиеся скорости заменяются нулём.
LandingDispersionDlg.parameter.windDirection = Направление ветра
LandingDispersionDlg.parameter.windDirection.help = Поворачивает направление ветра на выборочный угол на каждой моделируемой высоте.
LandingDispersionDlg.parameter.airDensity = Плотность воздуха
LandingDispersionDlg.parameter.airDensity.help = Масштабирует плотность атмосферы, корректируя давление при температуре модели на всей траектории.
LandingDispersionDlg.parameter.guideAngle = Наклон направляющей
LandingDispersionDlg.parameter.guideAngle.help = Добавляет выборочную физическую погрешность наклона к заданному углу направляющей или направляющего рельса.
LandingDispersionDlg.parameter.guideDirection = Азимут направляющей
LandingDispersionDlg.parameter.guideDirection.help = Добавляет выборочную погрешность азимутальной выставки после учёта настройки пуска по ветру.
LandingDispersionDlg.parameter.mass = Общая масса
LandingDispersionDlg.parameter.mass.help = Масштабирует массу и моменты инерции ракеты во время полёта, сохраняя отдельно выбранное смещение центра тяжести. Множитель применяется и к конструкции, и к топливу, поэтому он не моделирует ошибку суммарного импульса; для этого используйте параметр тяги.
LandingDispersionDlg.parameter.axialCg = Продольное положение ЦТ
LandingDispersionDlg.parameter.axialCg.help = Смещает центр тяжести ракеты вперёд или назад вдоль её оси.
LandingDispersionDlg.parameter.axialDrag = Продольное сопротивление
LandingDispersionDlg.parameter.axialDrag.help = Масштабирует аэродинамический коэффициент продольной силы во время полёта.
LandingDispersionDlg.parameter.normalForce = Нормальная сила и моменты
LandingDispersionDlg.parameter.normalForce.help = Совместно масштабирует аэродинамические коэффициенты нормальной силы, продольного момента и демпфирующего момента.
LandingDispersionDlg.parameter.thrust = Тяга двигателя
LandingDispersionDlg.parameter.thrust.help = Масштабирует тягу, создаваемую каждым активным двигателем на траектории.
LandingDispersionDlg.parameter.ignitionDelay = Момент зажигания
LandingDispersionDlg.parameter.ignitionDelay.help = Сдвигает зажигание двигателей, запускаемых в воздухе, и двигателей верхних ступеней раньше или позже, не меняя заданную логику ступеней. Начальное зажигание при пуске не сдвигается, поскольку это лишь переносит весь полёт во времени и не может изменить точку приземления.
LandingDispersionDlg.parameter.recoveryDrag = Площадь сопротивления системы спасения
LandingDispersionDlg.parameter.recoveryDrag.help = Масштабирует продольное сопротивление при раскрытом устройстве спасения, приближённо учитывая неопределённость его эффективной площади сопротивления. Один множитель охватывает все раскрытые устройства, поэтому тормозной и основной парашюты изменяются вместе.
LandingDispersionDlg.parameter.deploymentDelay = Момент раскрытия
