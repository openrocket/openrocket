! Shape
Shape.Conical = Cónica
Shape.Conical.desc1 = Una punta cónica tiene un perfil triangular.
Shape.Conical.desc2 = Una transición cónica tiene lados rectos.
Shape.Ogive = Ojiva
Shape.Ogive.desc1 = Una punta ojival tiene un perfil que es un segmento de círculo. Con parámetro 1 produce una <b>ojiva tangente</b>; valores menores producen <b>ojivas secantes</b>.
Shape.Ogive.desc2 = Una transición ojival tiene un perfil circular. Con parámetro 1 produce una <b>ojiva tangente</b>; valores menores producen <b>ojivas secantes</b>.
Shape.Ellipsoid = Elipsoidal
Shape.Ellipsoid.desc1 = Una punta elipsoidal tiene un perfil de media elipse con ejes mayores de 2×<i>Longitud</i> y <i>Diámetro</i>.
Shape.Ellipsoid.desc2 = Una transición elipsoidal tiene un perfil de media elipse. Si no está recortada, el perfil se extiende en el centro según el radio correspondiente.
Shape.Powerseries = Serie de potencia
Shape.Powerseries.desc1 = Una punta de serie de potencia tiene perfil <i>Radio</i>×(<i>x</i>/<i>Longitud</i>)<sup><i>k</i></sup>. Para <i>k</i>=0.5 es <b>parabólica</b>, para <i>k</i>=1 es <b>cónica</b>.
Shape.Powerseries.desc2 = Una transición de serie de potencia tiene el mismo tipo de perfil. Para <i>k</i>=0.5 es <b>parabólica</b>, para <i>k</i>=1 es <b>cónica</b>.
Shape.Parabolicseries = Serie parabólica
Shape.Parabolicseries.desc1 = Una punta parabólica tiene perfil parabólico. Con parámetro 1.0 es una <b>parábola completa</b>, 0.75 es <b>3/4</b>, 0.5 es <b>1/2</b>, y 0 es <b>cónica</b>.
Shape.Parabolicseries.desc2 = Igual para transiciones: parámetro 1.0 es <b>parábola completa</b>, 0.75 es <b>3/4</b>, 0.5 es <b>1/2</b>, y 0 es <b>cónica</b>.
Shape.Haackseries = Serie Haack
Shape.Haackseries.desc1 = Las puntas Haack minimizan el arrastre. Parámetro 0 produce <b>LD-Haack</b> o <b>Von Karman</b>; parámetro 0.333 produce <b>LV-Haack</b>.
Shape.Haackseries.desc2 = Las transiciones equivalentes no siempre producen arrastre óptimo, pero siguen la misma clasificación LD-Haack y LV-Haack.


