! ComponentInfo
ComponentInfo.Rocket = Este es tu cohete. Nada más que decir. ¡Diviértete diseñándolo y construyéndolo! :)
ComponentInfo.AxialStage = Una <b>etapa</b> es una <b>sección</b> del cohete que contiene <b>motores</b> que se encienden sucesivamente y se <b>separan</b> tras el apagado del motor.<br>Cada etapa debe descender de forma segura tras la separación. La etapa principal, llamada <b>Sustainer</b>, normalmente desciende con un <b>dispositivo de recuperación</b>.
ComponentInfo.ParallelStage = Un <b>booster</b> es un componente ficticio que actúa como <b>punto de unión</b> a un <b>tubo del cuerpo</b> y puede <b>separarse</b> en un momento específico del vuelo.<br>El uso más común es como <b>booster acoplado</b>.
ComponentInfo.PodSet = Un <b>pod</b> es un componente ficticio que actúa como <b>punto de unión</b> a un <b>tubo del cuerpo</b>.<br>Una vez definido, otros componentes pueden unirse al pod para crear geometrías complejas.
ComponentInfo.NoseCone = Una <b>punta</b> es el <b>extremo frontal</b> del fuselaje del cohete. Las puntas varían ampliamente en forma.<br>El extremo trasero puede recortarse para formar un <b>hombro interno</b> que se desliza dentro del tubo del cuerpo.
ComponentInfo.BodyTube = Un <b>tubo del cuerpo</b> se usa principalmente para la <b>estructura</b> exterior del cohete.
ComponentInfo.Transition = Una <b>transición</b> conecta dos <b>tubos del cuerpo</b> con <b>diámetros exteriores diferentes</b>.<br>Ambos extremos se recortan para formar hombros internos que se deslizan dentro de cada tubo.
ComponentInfo.TrapezoidFinSet = Las aletas ayudan a <b>estabilizar</b> el cohete. La forma más común es la <b>trapezoidal</b>.
ComponentInfo.EllipticalFinSet = Las aletas ayudan a <b>estabilizar</b> el cohete. La forma más eficiente es la <b>elíptica</b>, que genera el <b>menor arrastre</b>.
ComponentInfo.FreeformFinSet = Las aletas ayudan a <b>estabilizar</b> el cohete. Las aletas de <b>forma libre</b> permiten crear prácticamente cualquier forma sólida.
ComponentInfo.TubeFinSet = Las <b>aletas de tubo</b> mantienen el cohete <b>recto tras el lanzamiento</b>.
ComponentInfo.RailButton = Los <b>botones de riel</b> evitan que el cohete <b>cambie de orientación</b> al lanzarse.
ComponentInfo.LaunchLug = Un <b>ojal de lanzamiento</b> guía a los cohetes pequeños para evitar que cambien de orientación antes de dejar la varilla.
ComponentInfo.InnerTube = Los <b>tubos internos</b> se usan principalmente como <b>tubos de motor</b>.
ComponentInfo.TubeCoupler = Un <b>acoplador</b> une dos <b>tubos</b> del mismo diámetro.
ComponentInfo.CenteringRing = Los <b>anillos centradores</b> posicionan <b>tubos internos</b> dentro del <b>tubo del cuerpo</b>.
ComponentInfo.Bulkhead = Un <b>mamparo</b> es un disco que puede sellar áreas o montar sistemas de recuperación.
ComponentInfo.EngineBlock = Un <b>bloque de motor</b> evita que el motor se <b>desplace hacia adelante</b>.
ComponentInfo.Parachute = El <b>paracaídas</b> es el dispositivo de recuperación más común.
ComponentInfo.Streamer = Una <b>cinta</b> es un dispositivo de recuperación que se despliega y <b>frena</b> el cohete.
ComponentInfo.ShockCord = Una <b>cuerda de choque</b> une la punta y el dispositivo de recuperación al cuerpo.
ComponentInfo.MassComponent = Un <b>componente de masa</b> simula un componente no listado, como un <b>altímetro</b> o una <b>batería</b>.

