! ComponentInfo
ComponentInfo.Rocket = Ceci est votre rocket. Rien de plus à dire. Amusez‑vous à le concevoir et le construire :)
ComponentInfo.AxialStage = Un <b>étage</b> est une <b>section</b> du rocket contenant des <b>moteurs</b> qui s’allument successivement et se <b>séparent</b> après extinction. <br>Chaque étage doit descendre en sécurité après séparation. L’étage principal, souvent appelé <b>« Sustainer »</b>, descend généralement avec un <b>système de récupération</b>.
ComponentInfo.ParallelStage = Un <b>booster</b> est un composant fictif servant de <b>point d’attache</b> à un <b>tube de corps</b> et pouvant se <b>séparer</b> à un moment défini du vol. <br>L’usage le plus courant est le <b>strap‑on booster</b>.
ComponentInfo.PodSet = Un <b>pod</b> est un composant fictif servant de <b>point d’attache</b> à un <b>tube de corps</b>. <br>D’autres composants peuvent ensuite être attachés au pod pour créer des géométries complexes.
ComponentInfo.NoseCone = Une <b>ogive</b> est l’<b>extrémité avant</b> du rocket. Les ogives varient beaucoup en forme. <br>L’arrière peut être coupé pour former un <b>épaulement interne</b> qui s’insère dans le tube de corps.
ComponentInfo.BodyTube = Un <b>tube de corps</b> sert principalement de <b>structure</b> au rocket.
ComponentInfo.Transition = Une <b>transition</b> relie deux <b>tubes de corps</b> de <b>diamètres différents</b>. <br>Les deux extrémités sont coupées pour former des épaulements internes qui s’insèrent dans chaque tube.
ComponentInfo.TrapezoidFinSet = Les ailerons <b>stabilisent</b> le rocket. La forme la plus courante est <b>trapézoïdale</b>.
ComponentInfo.EllipticalFinSet = Les ailerons <b>stabilisent</b> le rocket. La forme la plus efficace est <b>elliptique</b>, produisant la <b>plus faible traînée</b>.
ComponentInfo.FreeformFinSet = Les ailerons <b>stabilisent</b> le rocket. Les ailerons <b>freeform</b> permettent de créer presque n’importe quelle forme solide.
ComponentInfo.TubeFinSet = Les <b>ailerons tubulaires</b> maintiennent le rocket <b>droit après le lancement</b>.
ComponentInfo.RailButton = Les <b>boutons de rail</b> empêchent le rocket de <b>changer d’orientation</b> au lancement.
ComponentInfo.LaunchLug = Un <b>launch lug</b> est le guide le plus courant pour les petits rockets.
ComponentInfo.InnerTube = Les <b>tubes internes</b> servent souvent de <b>tubes moteur</b>.
ComponentInfo.TubeCoupler = Un <b>manchon</b> relie deux <b>tubes</b> de même diamètre.
ComponentInfo.CenteringRing = Les <b>anneaux de centrage</b> positionnent les <b>tubes internes</b> dans le tube de corps.
ComponentInfo.Bulkhead = Une <b>cloison</b> sert à <b>séparer</b> des zones ou à fixer des éléments du système de récupération.
ComponentInfo.EngineBlock = Un <b>bloc moteur</b> empêche le <b>moteur</b> d’avancer dans le tube.
ComponentInfo.Parachute = Le <b>parachute</b> est le dispositif de récupération le plus courant.
ComponentInfo.Streamer = Un <b>ruban</b> est un dispositif de récupération qui <b>ralentit</b> le rocket.
ComponentInfo.ShockCord = Une <b>corde d’amortissement</b> relie l’ogive et le dispositif de récupération au tube de corps.
ComponentInfo.MassComponent = Un <b>composant de masse</b> simule un composant <b>non listé</b> (altimètre, batterie, etc.).

