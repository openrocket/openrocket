! Shape
Shape.Conical = Conique
Shape.Conical.desc1 = Une ogive conique a un profil triangulaire.
Shape.Conical.desc2 = Une transition conique a des côtés droits.
Shape.Ogive = Ogive
Shape.Ogive.desc1 = Une ogive a un profil en segment de cercle. Le paramètre de forme 1 produit une <b>ogive tangente</b>, avec transition douce vers le tube de corps ; des valeurs < 1 produisent des <b>ogives sécantes</b>.
Shape.Ogive.desc2 = Une transition ogive a un profil en segment de cercle. Le paramètre 1 produit une <b>ogive tangente</b> à l’arrière ; des valeurs < 1 produisent des <b>ogives sécantes</b>.
Shape.Ellipsoid = Ellipsoïdale
Shape.Ellipsoid.desc1 = Une ogive ellipsoïdale a un profil de demi‑ellipse avec axes 2×<i>Longueur</i> et <i>Diamètre</i>.
Shape.Ellipsoid.desc2 = Une transition ellipsoïdale a un profil de demi‑ellipse ; si non coupée, le profil est prolongé au centre par le rayon correspondant.
Shape.Powerseries = Série puissance
Shape.Powerseries.desc1 = Une ogive série puissance a un profil <i>Rayon</i>×(<i>x</i>/<i>Longueur</i>)<sup><i>k</i></sup>. Pour <i>k</i>=0,5 : <b>½‑puissance</b> ou <b>parabolique</b> ; <i>k</i>=0,75 : <b>¾‑puissance</b> ; <i>k</i>=1 : <b>conique</b>.
Shape.Powerseries.desc2 = Une transition série puissance suit la même formule. <i>k</i>=0,5 : <b>½‑puissance</b> ; <i>k</i>=0,75 : <b>¾‑puissance</b> ; <i>k</i>=1 : <b>conique</b>.
Shape.Parabolicseries = Série parabolique
Shape.Parabolicseries.desc1 = Une ogive parabolique a un profil de parabole. Le paramètre définit le segment utilisé : 1,0 = <b>parabole complète</b> ; 0,75 = <b>¾ parabole</b> ; 0,5 = <b>½ parabole</b> ; 0 = <b>conique</b>.
Shape.Parabolicseries.desc2 = Une transition parabolique suit la même logique, tangent au tube à l’arrière pour paramètre 1,0.
Shape.Haackseries = Série Haack
Shape.Haackseries.desc1 = Les ogives Haack minimisent la traînée. Paramètre 0 = <b>LD‑Haack</b> ou <b>Von Karman</b> ; paramètre 0,333 = <b>LV‑Haack</b>.
Shape.Haackseries.desc2 = Les transitions Haack sont analogues mais pas forcément optimales pour transitions.


