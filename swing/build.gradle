import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'checkstyle'
    id 'org.gradlex.extra-java-module-info' version '1.13.1'
}

java {
    // Must be disabled in order to use the gradle-modules-plugin
    modularity.inferModulePath = false
}

def buildProperties = new Properties()
file('../core/src/main/resources/build.properties').withInputStream { buildProperties.load(it) }
group = 'info.openrocket'
version = buildProperties['build.version']

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
}

checkstyle {
    ignoreFailures = false
    maxWarnings = 0
}

configurations {
    testArtifactsClasspath {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
    lwjglNativeArtifacts {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

def lwjglVersionValue = "3.4.1"
def lwjgl3AwtVersionValue = "0.2.4"
def jomlVersionValue = "1.10.8"

// Some older libraries are not modularized, so we need to add module-info.java files for them.
extraJavaModuleInfo {
    failOnMissingModuleInfo = false
    skipLocalJars = true
    automaticModule('slf4j-api-1.7.25.jar', 'org.slf4j.api')
    automaticModule('slf4j-api-1.7.32.jar', 'org.slf4j.api')
    automaticModule('versioncompare-1.5.0.jar', 'versioncompare')
    module('jcommon-1.0.24.jar', 'jcommon', '1.0.24') {
        requires('java.desktop')
        exportAllPackages()
    }
    module('itextpdf-5.5.13.3.jar', 'itextpdf') {
        requires('java.desktop')
        exportAllPackages()
    }

    automaticModule('obj-0.4.0.jar', 'de.javagl.obj')
    automaticModule("lwjgl3-awt-${lwjgl3AwtVersionValue}.jar", 'lwjgl3.awt')
}

ext {
    lwjglVersion = lwjglVersionValue
    lwjgl3AwtVersion = lwjgl3AwtVersionValue
    jomlVersion = jomlVersionValue

    switch (OperatingSystem.current()) {
        case OperatingSystem.FREE_BSD:
            lwjglNatives = "natives-freebsd"
            break
        case OperatingSystem.LINUX:
            lwjglNatives = "natives-linux"
            def osArch = System.getProperty("os.arch")
            if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
                lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
            } else if  (osArch.startsWith("ppc")) {
                lwjglNatives += "-ppc64le"
            } else if  (osArch.startsWith("riscv")) {
                lwjglNatives += "-riscv64"
            }
            break
        case OperatingSystem.MAC_OS:
            lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
            break
        case OperatingSystem.WINDOWS:
            def osArch = System.getProperty("os.arch")
            lwjglNatives = osArch.contains("64")
                    ? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}"
                    : "natives-windows-x86"
            break
    }
}

def extractLwjglNatives = tasks.register('extractLwjglNatives', Sync) {
    into layout.buildDirectory.dir('lwjgl-natives')
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({
        configurations.lwjglNativeArtifacts.files.collect { zipTree(it) }
    }) {
        include '**/*.dll', '**/*.dylib', '**/*.jnilib', '**/*.so'
        eachFile { details ->
            details.path = details.name
        }
    }
}

tasks.withType(JavaExec).configureEach {
    dependsOn(extractLwjglNatives)
    systemProperty 'org.lwjgl.librarypath', "${buildDir}/lwjgl-natives"
}

tasks.withType(Test).configureEach {
    dependsOn(extractLwjglNatives)
    systemProperty 'org.lwjgl.librarypath', "${buildDir}/lwjgl-natives"
}

dependencies {
    implementation(project(path: ':core', configuration: 'default'))

    implementation 'de.javagl:obj:0.4.0'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'org.commonmark:commonmark:0.27.0'
    implementation 'com.google.inject:guice:7.0.0'
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'org.jfree:jcommon:1.0.24'
    implementation 'org.jfree:jfreechart:1.5.6'
    implementation 'com.miglayout:miglayout-core:11.4.2'
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'

    implementation 'io.github.g00fy2:versioncompare:1.5.0'
    implementation 'com.github.Dansoftowner:jSystemThemeDetector:3.9.1'

    implementation 'com.formdev:flatlaf:3.6.2'
    implementation 'com.formdev:flatlaf-extras:3.6.2'
    implementation 'com.formdev:flatlaf-intellij-themes:3.6.2'
    implementation 'com.github.weisj:jsvg:2.0.0'

    implementation 'ch.qos.logback:logback-core:1.5.20'
    implementation 'ch.qos.logback:logback-classic:1.5.20'

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-jawt"

    // Natives for the current build platform (used for local development and testing)
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    lwjglNativeArtifacts platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    lwjglNativeArtifacts "org.lwjgl:lwjgl::$lwjglNatives"
    lwjglNativeArtifacts "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    lwjglNativeArtifacts "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    lwjglNativeArtifacts "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation("org.lwjglx:lwjgl3-awt:${lwjgl3AwtVersion}") {
        exclude group: "org.lwjgl"
    }
    implementation "org.joml:joml:${jomlVersion}"

    testImplementation 'ch.qos.logback:logback-classic:1.5.20'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                // TODO: we should really increase this...
                minimum = 0.05
            }
        }
    }
}
